# Streamlit application secrets template
# Copy this file to .streamlit/secrets.toml and fill in your credentials.
# Command: cp .streamlit/secrets.example.toml .streamlit/secrets.toml

[mongodb]
MONGODB_URI = "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority"
DATABASE_NAME = "secure_file_mgmt"

[api]
# Free tier VirusTotal API key (register at https://www.virustotal.com/)
VIRUSTOTAL_API_KEY = "your_virustotal_api_key_here"

[app]
MAX_FILE_SIZE_MB = 50
ALLOWED_FILE_TYPES = "pdf,txt,docx,xlsx,jpg,png,zip"

# Envelope Encryption Master Key:
# Fernet 32-byte URL-safe base64 master key used to wrap per-file data keys.
# Generate a new master key by running:
# python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
MASTER_ENCRYPTION_KEY = "your_base64_fernet_master_key_here"

[email]
SMTP_SERVER = "smtp.gmail.com"
SMTP_PORT = 587
SENDER_EMAIL = "your.email@gmail.com"
SENDER_PASSWORD = "your_16_char_app_password"
