<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Secure File Management System</title>
  <desc id="hero-desc">Upload, encrypt, scan, and share files — secured end-to-end with AES-256, VirusTotal, and TOTP 2FA.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="teal-fade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00c2a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00c2a8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="layer-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c2a8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00c2a8" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="round-clip">
      <rect width="1200" height="380" rx="18"/>
    </clipPath>
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg-grad)"/>

  <!-- Grid lines — subtle -->
  <g clip-path="url(#round-clip)" opacity="0.05">
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="0" y1="152" x2="1200" y2="152" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="0" y1="228" x2="1200" y2="228" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="0" y1="304" x2="1200" y2="304" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="200" y1="0" x2="200" y2="380" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="400" y1="0" x2="400" y2="380" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="600" y2="380" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="800" y1="0" x2="800" y2="380" stroke="#00c2a8" stroke-width="0.6"/>
    <line x1="1000" y1="0" x2="1000" y2="380" stroke="#00c2a8" stroke-width="0.6"/>
  </g>

  <!-- Vertical divider -->
  <line x1="570" y1="40" x2="570" y2="340" stroke="#00c2a8" stroke-width="0.8" opacity="0.2"/>

  <!-- ─── LEFT BLOCK: Title ─── -->
  <g id="title-block" transform="translate(60 60)">

    <!-- Category label -->
    <rect x="0" y="0" width="198" height="26" rx="4" fill="#00c2a8" fill-opacity="0.12"/>
    <rect x="0" y="0" width="198" height="26" rx="4" stroke="#00c2a8" stroke-width="0.8" fill="none" opacity="0.5"/>
    <text x="12" y="17" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#00c2a8" letter-spacing="1.5">SECURITY · PYTHON · STREAMLIT</text>

    <!-- Shield icon — project-native motif -->
    <g transform="translate(0 46)" filter="url(#glow-sm)">
      <path d="M22 4 L38 4 L38 22 C38 30 30 36 22 38 C14 36 6 30 6 22 L6 4 Z"
            fill="none" stroke="#00c2a8" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Lock body -->
      <rect x="16" y="20" width="12" height="9" rx="2" fill="#00c2a8" opacity="0.9"/>
      <!-- Lock shackle -->
      <path d="M18 20 L18 16 C18 13.2 26 13.2 26 16 L26 20"
            fill="none" stroke="#00c2a8" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Lock keyhole -->
      <circle cx="22" cy="25" r="1.5" fill="#080b12"/>
    </g>

    <!-- Project name -->
    <text x="0" y="114" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="48" font-weight="800" fill="#e8eaf0" letter-spacing="-0.5">Secure File</text>
    <text x="0" y="165" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="48" font-weight="800" fill="#e8eaf0" letter-spacing="-0.5">Management</text>
    <text x="0" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="40" font-weight="300" fill="#00c2a8" letter-spacing="-0.5">System</text>

    <!-- Tagline -->
    <text x="0" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="18" fill="#8090a8" font-weight="400">Encrypt · Scan · Share · Audit</text>

    <!-- Quick-start pill -->
    <g transform="translate(0 270)">
      <rect x="0" y="0" width="286" height="38" rx="6" fill="#1a2235"/>
      <rect x="0" y="0" width="286" height="38" rx="6" stroke="#2a3650" stroke-width="0.8" fill="none"/>
      <text x="16" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="15" fill="#4d9" letter-spacing="0.3">$</text>
      <text x="30" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="15" fill="#c8d8f0">uv run streamlit run app.py</text>
    </g>
  </g>

  <!-- ─── RIGHT BLOCK: Security layer diagram ─── -->
  <g id="security-layers" transform="translate(604 44)">

    <text x="174" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="11" fill="#4a5a70" text-anchor="middle" letter-spacing="1">SECURITY STACK</text>

    <!-- Layer 1: 2FA -->
    <g transform="translate(0 38)">
      <rect x="0" y="0" width="348" height="52" rx="8" fill="#111827"/>
      <rect x="0" y="0" width="348" height="52" rx="8" stroke="#1e2d45" stroke-width="0.8" fill="none"/>
      <!-- left teal bar -->
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#00c2a8"/>
      <!-- icon area -->
      <text x="22" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#00c2a8">⬡</text>
      <text x="50" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="16" font-weight="600" fill="#e0eaf8">TOTP Two-Factor Auth</text>
      <text x="50" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="11" fill="#4a6080">pyotp · Google Authenticator · Authy</text>
    </g>

    <!-- Connector arrow -->
    <line x1="174" y1="94" x2="174" y2="108" stroke="#00c2a8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <polygon points="170,107 178,107 174,114" fill="#00c2a8" opacity="0.5"/>

    <!-- Layer 2: AES Encryption -->
    <g transform="translate(0 116)">
      <rect x="0" y="0" width="348" height="52" rx="8" fill="#111827"/>
      <rect x="0" y="0" width="348" height="52" rx="8" stroke="#1e2d45" stroke-width="0.8" fill="none"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#00c2a8"/>
      <text x="22" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#00c2a8">⊞</text>
      <text x="50" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="16" font-weight="600" fill="#e0eaf8">AES-256 Encryption at Rest</text>
      <text x="50" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="11" fill="#4a6080">Fernet · cryptography · per-file keys</text>
    </g>

    <!-- Connector arrow -->
    <line x1="174" y1="172" x2="174" y2="186" stroke="#00c2a8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <polygon points="170,185 178,185 174,192" fill="#00c2a8" opacity="0.5"/>

    <!-- Layer 3: Malware Scan -->
    <g transform="translate(0 194)">
      <rect x="0" y="0" width="348" height="52" rx="8" fill="#111827"/>
      <rect x="0" y="0" width="348" height="52" rx="8" stroke="#1e2d45" stroke-width="0.8" fill="none"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#00c2a8"/>
      <text x="22" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#00c2a8">⬡</text>
      <text x="50" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="16" font-weight="600" fill="#e0eaf8">VirusTotal Malware Scan</text>
      <text x="50" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="11" fill="#4a6080">hash lookup · 70+ AV engines · free tier</text>
    </g>

    <!-- Connector arrow -->
    <line x1="174" y1="250" x2="174" y2="264" stroke="#00c2a8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <polygon points="170,263 178,263 174,270" fill="#00c2a8" opacity="0.5"/>

    <!-- Layer 4: Audit Logs -->
    <g transform="translate(0 272)">
      <rect x="0" y="0" width="348" height="52" rx="8" fill="#111827"/>
      <rect x="0" y="0" width="348" height="52" rx="8" stroke="#1e2d45" stroke-width="0.8" fill="none"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#00c2a8"/>
      <text x="22" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#00c2a8">≡</text>
      <text x="50" y="24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
            font-size="16" font-weight="600" fill="#e0eaf8">MongoDB Audit Trail</text>
      <text x="50" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
            font-size="11" fill="#4a6080">access_logs · security_logs · pymongo</text>
    </g>
  </g>

  <!-- Bottom metadata strip -->
  <g transform="translate(60 354)">
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#2a3a50">
      <tspan>Python 3.12+</tspan>
      <tspan dx="20">·</tspan>
      <tspan dx="20">Streamlit</tspan>
      <tspan dx="20">·</tspan>
      <tspan dx="20">MongoDB</tspan>
      <tspan dx="20">·</tspan>
      <tspan dx="20">MIT License</tspan>
    </text>
  </g>
</svg>
